[project]
name = "mc-diamond"
version = "0.1.0"
description = "Minecraft action-selection experiment diagnostics"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
model = ["torch==2.14.0", "transformers==5.17.0", "safetensors==0.8.0", "huggingface-hub>=1,<2"]
planner = [
    "mc-diamond[model]",
    "accelerate>=1,<2",
    "bitsandbytes>=0.48,<1",
]

[project.scripts]
mc-diamond = "mc_diamond.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9,<10", "mypy>=1.18,<2", "types-PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-plugin-autoload"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["^\\.bootstrap/", "^\\.tools/", "^archive/", "^artifacts/", "^checkpoints/"]
plugins = ["pydantic.mypy"]
