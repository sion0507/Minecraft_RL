# Natural G2 acceptance (T07 #8): same G2 snapshot/start/stone pickaxe/12,000 ticks as configs/g2.yaml,
# but the decision cap cannot bind before the active limit. g2.yaml stays the 64-decision diagnostic baseline.
backend: rpc
command: [node, bridge/minecraft.js, --task, G2]
rpc_timeout_seconds: 180.0
max_decisions: 12000
wall_limit_seconds: 2700.0
goal:
  goal_id: g2-direct-iron
  kind: collect
  target: iron_ore
  quantity: 3
